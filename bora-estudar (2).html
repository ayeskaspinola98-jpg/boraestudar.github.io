<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4338ca">
<title>Bora Estudar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: navegação lateral no PC, barra inferior no celular. Uma ação principal por tela, cor própria por matéria. */
:root{
  --bg:#f1f3f9; --surface:#ffffff; --surface2:#f6f7fc; --ink:#11141f; --ink2:#485066; --muted:#7a8299;
  --line:#e1e5ef; --grid:#e8ebf3; --axis:#c3c9d8;
  --accent:#4338ca; --accent-ink:#ffffff; --accent-soft:#e7e6fb;
  --good:#0ca30c; --good-text:#006300; --warn:#fab219; --warn-ink:#0b0b0b;
  --shadow:0 1px 2px rgba(17,20,31,.06),0 10px 28px rgba(17,20,31,.06);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0f17; --surface:#161925; --surface2:#1c2030; --ink:#eef0f7; --ink2:#b7bdce; --muted:#8a92a8;
    --line:#272c3d; --grid:#242938; --axis:#383e52;
    --accent:#a2a4fa; --accent-ink:#0d0f17; --accent-soft:#24274a;
    --good-text:#0ca30c; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0f17; --surface:#161925; --surface2:#1c2030; --ink:#eef0f7; --ink2:#b7bdce; --muted:#8a92a8;
  --line:#272c3d; --grid:#242938; --axis:#383e52;
  --accent:#a2a4fa; --accent-ink:#0d0f17; --accent-soft:#24274a;
  --good-text:#0ca30c; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)} .ink2{color:var(--ink2)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.side{display:none}
.main-in{padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1120px;width:100%;margin-inline:auto}
@media(min-width:900px){
  .shell{grid-template-columns:232px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:24px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .main-in{padding:28px 32px 60px}
  .tabs{display:none!important}
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-family:var(--display);font-weight:700;font-size:19px}
.brand svg{width:46px;height:46px;flex:none}
.brand span{font-size:21px;font-weight:800;line-height:1;letter-spacing:-.02em}
.brand-m{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-family:var(--display);font-size:18px}
.brand-m svg{width:38px;height:38px;flex:none}
@media(min-width:900px){.brand-m{display:none}}
body.clean .brand-m{display:none}
.dogsay{display:flex;align-items:flex-end;gap:12px}
.dogsay>svg{width:92px;height:auto;flex:none}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 16px;font-weight:600;box-shadow:var(--shadow);margin-bottom:14px;min-width:0}
.bubble::before{content:"";position:absolute;left:-8px;bottom:12px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.brandhero{display:grid;gap:14px;align-items:end;margin-bottom:20px}
@media(min-width:760px){.brandhero{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}}
.wm{font-family:var(--display);font-weight:800;font-size:clamp(46px,11vw,76px);line-height:.95;letter-spacing:-.035em}
.wm .hl{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--warn) 75%,transparent) 60% 90%,transparent 90%);padding-inline:2px}
.mm-scroll{overflow:auto;max-height:68vh;min-height:320px;border-radius:20px;border:1px solid var(--line);background-color:var(--surface);background-image:radial-gradient(var(--grid) 1.3px,transparent 1.3px);background-size:22px 22px;-webkit-overflow-scrolling:touch}
.mm-scroll svg{display:block}
.mmt{font:600 14px var(--body)}
.mm-n{cursor:pointer;outline:none}
.mm-n:focus-visible .bx{stroke:var(--accent);stroke-width:4}
.mm-tool{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px}
.mm-tool input{flex:1 1 220px;width:auto}
.wm-sub{margin-top:10px;color:var(--ink2);font-weight:500;font-size:16px;max-width:30ch}
.nav-b{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 12px;border-radius:14px;color:var(--ink2);font-weight:600;text-align:left}
.nav-b svg{width:22px;height:22px;flex:none}
.nav-b:hover{background:var(--surface2)}
.nav-b[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side-xp{margin-top:auto;padding:14px;border-radius:16px;background:var(--surface2)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tab-b{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border-radius:12px;font-size:10.5px;font-weight:600;color:var(--muted);padding:0;min-width:0}
.tab-b svg{width:24px;height:24px}
.tab-b[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{font-size:clamp(26px,5vw,36px);font-weight:700}
.top-r{display:flex;align-items:center;gap:8px}
.icon-b{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);color:var(--ink2)}
.icon-b svg{width:22px;height:22px}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.pill .dot{width:9px;height:9px;border-radius:50%;background:currentColor;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

.card{background:var(--surface);border-radius:22px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:20px;font-weight:650}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h .sub{color:var(--muted);font-size:14px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.g32{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}.span2{grid-column:1/-1}}
.stack{display:flex;flex-direction:column;gap:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border-radius:16px;font-weight:700;background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn svg{width:22px;height:22px}
.btn:hover{border-color:var(--axis)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;min-height:60px;font-size:18px;padding:0 28px}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.danger{color:#d03b3b}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.mission{background:linear-gradient(135deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 70%,#000) 100%);color:var(--accent-ink);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mission{background:linear-gradient(135deg,#363a8f 0%,#23265f 100%);color:#eef0f7}}
:root[data-theme="dark"] .mission{background:linear-gradient(135deg,#363a8f 0%,#23265f 100%);color:#eef0f7}
.mission .eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.mission h2{font-size:clamp(26px,4.4vw,36px);font-weight:700}
.mission .why{opacity:.9;font-size:15px}
.mission .btn.primary{background:#fff;color:#2a2680;align-self:flex-start}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:0 12px;border-radius:999px;background:var(--surface2);font-weight:600;font-size:14px;border:1px solid var(--line)}
.mission .chip{background:rgba(255,255,255,.16);border-color:transparent;color:inherit}
.sdot{width:12px;height:12px;border-radius:50%;flex:none}

.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ring-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.kv{display:flex;flex-direction:column}
.kv b{font-family:var(--display);font-size:26px;line-height:1.1}
.kv span{color:var(--muted);font-size:13.5px}
.bar{height:12px;border-radius:999px;background:var(--grid);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.wd i{display:grid;place-items:center;width:100%;max-width:44px;aspect-ratio:1;border-radius:14px;background:var(--grid)}
.wd i svg{width:20px;height:20px}
.wd.on i{background:var(--accent);color:var(--accent-ink)}
.wd.today i{outline:2px solid var(--accent);outline-offset:2px}
.wd.today{color:var(--ink)}
.quest{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--surface2)}
.quest .ck{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--axis);flex:none;color:transparent}
.quest .ck svg{width:20px;height:20px}
.quest.done .ck{background:var(--good);border-color:var(--good);color:#fff}
.quest.done .t{text-decoration:line-through;color:var(--muted)}
.quest .t{font-weight:600}
.quest small{display:block;color:var(--muted);font-weight:500}
.quest .bar{margin-top:6px;height:8px}

label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;color:var(--ink2)}
input[type=text],input[type=number],input[type=date],select{min-height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);width:100%}
input:focus-visible,select:focus-visible{outline-offset:0;border-color:var(--accent)}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));align-items:end}

/* foco */
.focus-wrap{display:flex;flex-direction:column;align-items:center;gap:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip-b{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:600}
.chip-b[aria-pressed="true"]{border-color:var(--ink);background:var(--surface2)}
.chip-b[disabled]{opacity:.55;cursor:not-allowed}
.seg{display:inline-flex;padding:4px;border-radius:16px;background:var(--grid);gap:4px}
.seg button{min-height:42px;padding:0 16px;border-radius:12px;font-weight:700;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.timer{position:relative;width:min(78vw,320px);aspect-ratio:1}
.timer svg{width:100%;height:100%;display:block}
.timer .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.timer .big{font-family:var(--display);font-weight:700;font-size:clamp(52px,16vw,76px);font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.timer .lbl{font-weight:600;color:var(--ink2)}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.done-card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;overflow:hidden}
.done-card .xp{font-family:var(--display);font-size:44px;font-weight:800;color:var(--accent)}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(340px) rotate(540deg);opacity:0}}
.park{display:flex;gap:8px}
.park-i{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:12px;background:var(--surface2);font-size:15px}
body.clean .side,body.clean .tabs,body.clean .top,body.clean .noclean{display:none!important}
body.clean .shell{grid-template-columns:minmax(0,1fr)}

/* matérias */
.subj-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.subj{display:flex;flex-direction:column;gap:14px}
.subj.open{grid-column:1/-1}
.subj-h{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.subj-h h3{font-size:19px;font-weight:650}
.subj-h .meta{color:var(--muted);font-size:14px}
.mini-st{display:flex;gap:6px;flex-wrap:wrap}
.mini-st span{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);font-weight:600}
.topics{display:flex;flex-direction:column;gap:8px}
.topic{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--surface2)}
.topic .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.st{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;font-weight:700;font-size:14px;white-space:nowrap;border:1.5px solid var(--line);background:var(--surface);color:var(--ink2)}
.st svg{width:20px;height:20px;flex:none}
.st1{color:var(--accent);border-color:var(--accent)}
.st2{background:var(--warn);color:var(--warn-ink);border-color:var(--warn)}
.st3{background:var(--good);color:#fff;border-color:var(--good)}
.x-b{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--muted);flex:none}
.x-b svg{width:18px;height:18px}
.x-b:hover{background:var(--grid);color:var(--ink)}

/* gráficos */
svg text.ax{font:500 11.5px var(--body);fill:var(--muted)}
svg text.ax.today{fill:var(--ink);font-weight:700}
svg text.lb{font:600 12px var(--body);fill:var(--ink2)}
svg text.vl{font:700 12px var(--body);fill:var(--ink)}
.chart{display:block;width:100%;height:auto;overflow:visible}
.hit{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13.5px;color:var(--ink2);font-weight:500}
.legend span{display:inline-flex;align-items:center;gap:7px}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.tile b{display:block;font-family:var(--display);font-size:30px;line-height:1.1}
.tile span{color:var(--muted);font-size:13.5px;font-weight:500}
.heat{display:grid;grid-template-columns:34px repeat(5,1fr);gap:6px;align-items:center}
.heat .hl{font-size:12px;color:var(--muted);font-weight:600}
.heat .hc{aspect-ratio:1;border-radius:9px;min-width:0;max-height:46px;width:100%;background:var(--grid)}
.heat .hc.fut{background:transparent;border:1.5px dashed var(--grid)}
.heat .hc.td{outline:2px solid var(--ink);outline-offset:1px}
.heat-key{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.heat-key i{width:16px;height:16px;border-radius:5px;display:block}
.acc-row{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0}
.acc-row .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-width:0}
.acc-row .nm b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-tr{position:relative;height:12px;border-radius:999px;background:var(--grid)}
.acc-tr i{display:block;height:100%;border-radius:999px}
.acc-tr u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink2);border-radius:2px}
.acc-row .v{font-family:var(--display);font-weight:700;font-size:15px;min-width:44px;text-align:right}

/* troféus */
.badges{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
.badge{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:20px 14px}
.badge svg{width:76px;height:76px}
.badge.lock svg{filter:grayscale(1);opacity:.45}
.badge b{font-family:var(--display);font-size:17px}
.badge small{color:var(--muted);font-size:13.5px}
.badge .bar{width:100%;height:8px}

.note{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:16px;background:var(--accent-soft);color:var(--ink);margin-bottom:16px;font-size:14.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:var(--shadow);max-width:calc(100vw - 32px);text-align:center;animation:up .25s ease-out}
@keyframes up{from{transform:translate(-50%,12px);opacity:0}}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;white-space:pre-line;max-width:240px;box-shadow:var(--shadow)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="tip" role="tooltip" hidden></div>
<div id="live" class="sr" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayStr=()=>ymd(new Date());
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
const fmtDM=s=>{const d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};

function templateSubjects(){return TEMPLATE.map((t,i)=>({id:'s'+i,name:t.n,c:i%8,topics:t.t.map((n,j)=>({id:'s'+i+'t'+j,n:n,st:0,d:''}))}))}
function makeSample(){
  const r=rng(20260), subs=templateSubjects(), today=new Date();
  const adv=[.8,.35,.55,.4,.6,.3];
  subs.forEach((s,i)=>s.topics.forEach(t=>{const x=r(),a=adv[i];t.st=x<a*.55?3:x<a*.55+.2?2:x<a*.55+.45?1:0}));
  const w=[3,1.2,2.4,1.8,.7,.5], base=[.78,.55,.68,.6,.72,.65], sessions=[], questions=[];
  const pick=()=>{let t=w.reduce((a,b)=>a+b,0)*r(),k=0;for(;k<w.length-1;k++){t-=w[k];if(t<=0)break}return k};
  for(let off=34;off>=0;off--){
    const dt=addDays(today,-off), d=ymd(dt);
    if(!(off<=4||r()<.72)) continue;
    const nb=off===0?1:1+Math.floor(r()*3);
    for(let b=0;b<nb;b++){const si=pick(),m=[15,15,25,10,25][Math.floor(r()*5)];sessions.push({d:d,s:subs[si].id,m:m,t:dt.getTime()+b})}
    if(off>0&&r()<.6){const si=pick(),n=10+Math.floor(r()*16),acc=clamp(base[si]+(34-off)/34*.1+(r()-.5)*.2,.25,.95);questions.push({d:d,s:subs[si].id,n:n,r:Math.round(n*acc)})}
  }
  return {v:1,updatedAt:0,isSample:true,profile:{name:'Analista Administrativo (exemplo)',date:ymd(addDays(today,97)),goal:60,block:15,acc:75},subjects:subs,sessions:sessions,questions:questions,parked:[]};
}

let ref=null,saveTimer=0,saving=false,dirty=false;
function persist(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(ref){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,900)}
}
async function flush(){
  if(!ref)return;
  if(saving){saveTimer=setTimeout(flush,600);return}
  saving=true;dirty=false;
  try{await ref.set({json:JSON.stringify(S),updatedAt:S.updatedAt})}catch(e){}
  saving=false;if(dirty)flush();
}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;
    const user=await window.claude.use('user'), db=await window.claude.use('db');
    if(!user||!db)return;
    const uid=await user.id(); if(!uid)return;
    const r=db.collection('data/users/'+uid).doc('estado');
    const snap=await r.get();
    ref=r;
    if(snap.exists){
      const d=snap.data();
      if(d&&d.json){
        const remote=JSON.parse(d.json);
        if((remote.updatedAt||0)>(S.updatedAt||0)){S=remote;ensureMaps();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}render()}
        else if((remote.updatedAt||0)<(S.updatedAt||0)){dirty=true;flush()}
      }
    } else if(!S.isSample){dirty=true;flush()}
  }catch(e){}
}

const subj=id=>S.subjects.find(s=>s.id===id);
const colVar=id=>{const s=subj(id);return 'var(--s'+(((s?s.c:7)%8)+1)+')'};
const colOf=s=>'var(--s'+((s.c%8)+1)+')';
function weekDays(n,endOff){const out=[];for(let i=n-1;i>=0;i--)out.push(ymd(addDays(new Date(),-i-(endOff||0))));return out}
function dayMap(){const m={};S.sessions.forEach(x=>{const o=m[x.d]||(m[x.d]={t:0,b:{}});o.t+=x.m;o.b[x.s]=(o.b[x.s]||0)+x.m});return m}
function streaks(dm){
  const days=Object.keys(dm).sort();let best=0,run=0,prev=null;
  days.forEach(d=>{run=(prev&&ymd(addDays(parse(prev),1))===d)?run+1:1;best=Math.max(best,run);prev=d});
  let cur=0,d=new Date();if(!dm[ymd(d)])d=addDays(d,-1);
  while(dm[ymd(d)]){cur++;d=addDays(d,-1)}
  return {cur:cur,best:best};
}
const mastery=s=>s.topics.length?s.topics.reduce((a,t)=>a+MW[t.st],0)/s.topics.length:0;
function totals(){
  const mins=S.sessions.reduce((a,x)=>a+x.m,0);
  const qn=S.questions.reduce((a,x)=>a+x.n,0), qr=S.questions.reduce((a,x)=>a+x.r,0);
  let topics=0,dom=0;const cnt=[0,0,0,0];
  S.subjects.forEach(s=>s.topics.forEach(t=>{topics++;cnt[t.st]++;if(t.st===3)dom++}));
  return {mins:mins,qn:qn,qr:qr,acc:qn?qr/qn:null,topics:topics,dom:dom,cnt:cnt,blocks:S.sessions.length};
}
function xpInfo(){const t=totals();const xp=t.mins+5*t.blocks+t.qr+20*t.dom;const L=Math.floor(xp/250)+1;return {xp:xp,level:L,into:xp%250,need:250}}
function todayStats(){
  const d=todayStr(),dm=dayMap();
  const q=S.questions.filter(x=>x.d===d).reduce((a,x)=>a+x.n,0);
  let tp=0;S.subjects.forEach(s=>s.topics.forEach(t=>{if(t.d===d)tp++}));
  return {min:dm[d]?dm[d].t:0,blocks:S.sessions.filter(x=>x.d===d).length,q:q,tp:tp};
}
function suggest(){
  const last=new Set(weekDays(7)),mins={};
  S.sessions.forEach(x=>{if(last.has(x.d))mins[x.s]=(mins[x.s]||0)+x.m});
  const c=S.subjects.filter(s=>s.topics.some(t=>t.st<3));
  if(!c.length)return null;
  c.sort((a,b)=>(mins[a.id]||0)-(mins[b.id]||0));
  const s=c[0],t=s.topics.find(t=>t.st===2)||s.topics.find(t=>t.st===0)||s.topics.find(t=>t.st===1);
  return {s:s,t:t,why:(mins[s.id]||0)===0?'Ainda sem estudo nos últimos 7 dias':'A matéria menos estudada nos últimos 7 dias'};
}

/* ---------- timer ---------- */
function fmtClock(s){return pad(Math.floor(s/60))+':'+pad(s%60)}
function timerStart(){
  if(!T.subj||!subj(T.subj))T.subj=S.subjects[0]?S.subjects[0].id:null;
  if(T.mode==='focus'&&!T.subj){toast('Adicione uma matéria primeiro');return}
  if(T.state==='idle'||T.state==='done'){T.total=(T.mode==='break'?3:tlen())*60;T.left=T.total}
  T.endAt=Date.now()+T.left*1000;T.state='run';T.result=null;
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
  clearInterval(T.iv);T.iv=setInterval(tick,250);render();
}
function timerPause(){T.left=Math.max(0,Math.ceil((T.endAt-Date.now())/1000));T.state='pause';clearInterval(T.iv);render()}
function timerReset(){clearInterval(T.iv);T.state='idle';T.mode='focus';T.result=null;T.total=tlen()*60;T.left=T.total;document.body.classList.remove('clean');render()}
function logSession(m){
  if(m<1)return null;
  S.sessions.push({d:todayStr(),s:T.subj,m:m,t:Date.now()});
  persist();return m+5;
}
function timerFinish(early){
  clearInterval(T.iv);
  if(T.mode==='break'){T.state='idle';T.mode='focus';T.total=tlen()*60;T.left=T.total;render();return}
  const leftNow=T.state==='run'?Math.max(0,Math.ceil((T.endAt-Date.now())/1000)):T.left;
  const doneSec=early?T.total-leftNow:T.total;
  const m=early?Math.floor(doneSec/60):Math.round(T.total/60);
  const xp=logSession(m);
  T.state='done';T.mode='focus';T.result=xp==null?{m:0,xp:0,early:true}:{m:m,xp:xp,s:T.subj};
  document.body.classList.remove('clean');
  if(!early)beep();
  render();
  if(view!=='foco'&&T.result&&T.result.m>0)toast('Bloco concluído! +'+T.result.xp+' XP');
}
function tick(){
  if(T.state!=='run')return;
  T.left=Math.max(0,Math.ceil((T.endAt-Date.now())/1000));
  const tt=$('#tm-text'),rg=$('#tm-ring'),pl=$('#pill-time');
  if(tt)tt.textContent=fmtClock(T.left);
  if(rg){const C=2*Math.PI*120;rg.setAttribute('stroke-dashoffset',String(C*(1-T.left/T.total)))}
  if(pl)pl.textContent=fmtClock(T.left);
  if(T.left<=0)timerFinish(false);
}
function beep(){
  try{const ac=new(window.AudioContext||window.webkitAudioContext)();
  [880,1175].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);
    const t=ac.currentTime+i*.18;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.start(t);o.stop(t+.32)})}catch(e){}
}

/* ---------- gráficos ---------- */
const niceMax=v=>{const s=[30,45,60,90,120,150,180,240,300,360];for(let i=0;i<s.length;i++)if(v<=s[i])return s[i];return Math.ceil(v/60)*60};
function topRound(x,y,w,h,r){r=Math.min(r,h,w/2);return 'M'+x+','+(y+h)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(y+h)+'Z'}
function barsChart(W){
  const days=weekDays(7),dm=dayMap(),H=236,L=34,R=8,T0=16,B=28,goal=S.profile.goal||60;
  const mx=niceMax(Math.max(goal*1.15,...days.map(d=>dm[d]?dm[d].t:0)));
  const pw=W-L-R,ph=H-T0-B,slot=pw/7,bw=Math.min(40,slot*.62),y=v=>T0+ph-(v/mx)*ph;
  let g='';
  [0,mx/2,mx].forEach(v=>{g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="'+(v===0?'var(--axis)':'var(--grid)')+'"/><text class="ax" x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+Math.round(v)+'</text>'});
  days.forEach((d,i)=>{
    const x=L+slot*i+(slot-bw)/2,info=dm[d],dt=parse(d);
    let tip=WD[dt.getDay()]+' '+fmtDM(d)+' · '+(info?fmtMin(info.t):'sem estudo');
    if(info){
      const ids=Object.keys(info.b).sort((a,b)=>S.subjects.findIndex(s=>s.id===a)-S.subjects.findIndex(s=>s.id===b));
      let acc=0;
      ids.forEach((id,k)=>{
        const v=info.b[id],top=y(acc+v),h=y(acc)-top,s=subj(id);
        tip+='\n'+(s?s.name:'Matéria removida')+': '+v+' min';
        const fill=colVar(id);
        g+=(k===ids.length-1)
          ?'<path d="'+topRound(x,top,bw,h,5)+'" fill="'+fill+'" stroke="var(--surface)" stroke-width="2"/>'
          :'<rect x="'+x+'" y="'+top+'" width="'+bw+'" height="'+h+'" fill="'+fill+'" stroke="var(--surface)" stroke-width="2"/>';
        acc+=v;
      });
    }
    g+='<text class="ax'+(i===6?' today':'')+'" x="'+(L+slot*i+slot/2)+'" y="'+(H-8)+'" text-anchor="middle">'+(i===6?'hoje':WD[dt.getDay()])+'</text>';
    g+='<rect class="hit" data-tip="'+esc(tip)+'" x="'+(L+slot*i)+'" y="'+T0+'" width="'+slot+'" height="'+(ph+B-4)+'" fill="transparent"/>';
  });
  g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(goal)+'" y2="'+y(goal)+'" stroke="var(--ink2)" stroke-dasharray="5 4" stroke-width="1.5"/><text class="lb" x="'+(W-R)+'" y="'+(y(goal)-5)+'" text-anchor="end">meta '+goal+' min</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Minutos estudados por dia nos últimos 7 dias, empilhados por matéria">'+g+'</svg>';
}
function heatmap(){
  const dm=dayMap(),now=new Date(),wd=(now.getDay()+6)%7,mon=addDays(now,-wd-28),tdy=todayStr();
  const lv=m=>m<=0?0:m<15?1:m<30?2:m<60?3:4,mixp=[0,28,52,76,100];
  const order=[1,2,3,4,5,6,0];
  let h='<div class="heat" role="img" aria-label="Calendário de estudo das últimas 5 semanas"><span></span>';
  for(let w=0;w<5;w++)h+='<span class="hl" style="text-align:center">'+fmtDM(ymd(addDays(mon,w*7))).slice(0,5)+'</span>';
  for(let r=0;r<7;r++){
    h+='<span class="hl">'+WD[order[r]]+'</span>';
    for(let w=0;w<5;w++){
      const dt=addDays(mon,w*7+r),d=ymd(dt),fut=d>tdy,m=dm[d]?dm[d].t:0,l=lv(m);
      const tip=WD[dt.getDay()]+' '+fmtDM(d)+' · '+(m?fmtMin(m):'sem estudo');
      h+='<button class="hc hit'+(fut?' fut':'')+(d===tdy?' td':'')+'" '+(fut?'disabled':'data-tip="'+esc(tip)+'"')+' aria-label="'+esc(tip)+'" style="'+(l?'background:color-mix(in srgb,var(--s1) '+mixp[l]+'%,var(--surface))':'')+'"></button>';
    }
  }
  h+='</div><div class="heat-key"><span>menos</span>';
  mixp.forEach(p=>{h+='<i style="background:'+(p?'color-mix(in srgb,var(--s1) '+p+'%,var(--surface))':'var(--grid)')+'"></i>'});
  return h+'<span>mais</span></div>';
}
function wrapLabel(n){
  const words=n.split(' '),lines=[''];
  words.forEach(w=>{const l=lines[lines.length-1];if((l+' '+w).trim().length<=12||!l)lines[lines.length-1]=(l+' '+w).trim();else lines.push(w)});
  if(lines.length>2){lines.length=2;lines[1]=lines[1].slice(0,11)+'…'}
  return lines.map(l=>l.length>13?l.slice(0,12)+'…':l);
}
function radar(W){
  const subs=S.subjects,n=subs.length;
  if(n<3)return '<p class="muted">Adicione pelo menos 3 matérias para ver o radar.</p>';

function lineChart(W){

function donut(){
  const t=totals(),cols=['var(--axis)','var(--s1)','var(--warn)','var(--good)'],tot=t.topics||1,r=56,C=2*Math.PI*r;

    g+='<circle class="hit" cx="80" cy="80" r="'+r+'" fill="none" stroke="'+cols[i]+'" stroke-width="22" stroke-dasharray="'+Math.max(0,len-gap)+' '+C+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 80 80)" data-tip="'+esc(ST[i]+': '+c+' tópicos')+'"/>';

const mm={id:null,sel:null,zoom:1,reveal:false,focus:false,sx:0,sy:0};
function mapFromSubject(s){
  const root={id:newId(),p:null,t:s.name,col:false},nodes=[root];
  s.topics.forEach(t=>nodes.push({id:newId(),p:root.id,t:t.n,col:false}));

}
function sampleMap(){
  const s=S.subjects.find(x=>x.name==='Direito Constitucional')||S.subjects[0];if(!s)return null;
  const m=mapFromSubject(s);
  const extra={'Princípios fundamentais':['Soberania','Cidadania','Dignidade da pessoa humana','Valores sociais do trabalho e da livre iniciativa','Pluralismo político'],'Direitos e garantias fundamentais':['Individuais e coletivos','Sociais','Nacionalidade','Direitos políticos'],'Poder Legislativo':['Câmara dos Deputados','Senado Federal']};
  m.nodes.slice().forEach(n=>{(extra[n.t]||[]).forEach(t=>m.nodes.push({id:newId(),p:n.id,t:t,col:false}))});
  return m;
}
function ensureMaps(){if(!S.maps){const m=S.isSample?sampleMap():null;S.maps=m?[m]:[]}}
const mmCur=()=>(S.maps||[]).find(x=>x.id===mm.id);
function mmDesc(m,id){const out=[id];let i=0;while(i<out.length){m.nodes.forEach(n=>{if(n.p===out[i]&&out.indexOf(n.id)<0)out.push(n.id)});i++}return out}
function mmWrap(t){
  const words=String(t||'').trim().split(/\s+/).filter(Boolean),out=[''];
  if(!words.length)return ['Ideia'];
  words.forEach(w=>{const l=out[out.length-1];if(!l)out[out.length-1]=w;else if((l+' '+w).length<=18)out[out.length-1]=l+' '+w;else out.push(w)});
  if(out.length>3){out.length=3;out[2]=out[2].slice(0,15)+'…'}
  return out.map(l=>l.length>22?l.slice(0,21)+'…':l);
}
function mmLayout(m){
  const kids={};m.nodes.forEach(n=>{const k=n.p||'';(kids[k]=kids[k]||[]).push(n)});
  const root=m.nodes.find(n=>!n.p);if(!root)return null;
  const info={},colW=[];let cursor=24;const GAP=14;
  function measure(n,d,ci){
    const ls=mmWrap(n.t),w=Math.max(70,Math.max.apply(null,ls.map(l=>l.length))*7.7+30),h=ls.length*19+18;
    info[n.id]={n:n,ls:ls,w:w,h:h,d:d,ci:ci,kc:(kids[n.id]||[]).length};
    colW[d]=Math.max(colW[d]||0,w);
    if(!n.col)(kids[n.id]||[]).forEach((c,i)=>measure(c,d+1,d===0?i:ci));
  }
  function place(n){
    const f=info[n.id],ch=n.col?[]:(kids[n.id]||[]);
    if(!ch.length){f.y=cursor+f.h/2;cursor+=f.h+GAP}
    else{ch.forEach(place);f.y=(info[ch[0].id].y+info[ch[ch.length-1].id].y)/2}
  }
  measure(root,0,0);place(root);
  const xs=[];let x=24;colW.forEach((w,i)=>{xs[i]=x;x+=w+60});
  Object.keys(info).forEach(id=>{info[id].x=xs[info[id].d]});
  return {info:info,W:Math.max(300,x-60+24),H:Math.max(200,cursor-GAP+24)};
}
function mmSvg(m){
  const L=mmLayout(m);if(!L)return '';
  const z=mm.zoom||1,slot=ci=>'var(--s'+((ci%8)+1)+')',ids=Object.keys(L.info);
  let e='',g='';
  ids.forEach(id=>{
    const f=L.info[id];if(!f.n.p)return;const p=L.info[f.n.p];if(!p)return;
    const x1=p.x+p.w,y1=p.y,x2=f.x,y2=f.y,mx=(x1+x2)/2;
    e+='<path d="M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2+'" fill="none" stroke="'+slot(f.ci)+'" stroke-width="'+(f.d===1?3.5:2.5)+'" stroke-linecap="round" opacity=".8"/>';
  });
  ids.forEach(id=>{
    const f=L.info[id],n=f.n,isSel=n.id===mm.sel,root=!n.p;
    const fill=root?'var(--accent)':f.d===1?slot(f.ci):'var(--surface)';
    const tx=root?'var(--accent-ink)':f.d===1?([2,3,4].indexOf(f.ci%8)>=0?'#0b0b0b':'#fff'):'var(--ink)';
    const stroke=(root||f.d===1)?'none':slot(f.ci),cx=f.x+f.w/2,top=f.y-f.h/2;
    g+='<g class="mm-n" data-act="mmSel" data-n="'+n.id+'" role="button" tabindex="0" aria-label="'+esc((n.t||'Ideia')+(isSel?' (selecionada)':''))+'">';
    if(isSel)g+='<rect x="'+(f.x-5)+'" y="'+(top-5)+'" width="'+(f.w+10)+'" height="'+(f.h+10)+'" rx="'+(root?22:18)+'" fill="none" stroke="var(--ink)" stroke-width="3"/>';
    g+='<rect class="bx" x="'+f.x+'" y="'+top+'" width="'+f.w+'" height="'+f.h+'" rx="'+(root?18:14)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5"/>';
    g+='<text class="mmt" text-anchor="middle" fill="'+tx+'">'+f.ls.map((l,k)=>'<tspan x="'+cx+'" y="'+(top+23+k*19)+'">'+esc(l)+'</tspan>').join('')+'</text></g>';
    if(f.kc>0){
      const bx=f.x+f.w,by=f.y,col=!!n.col;
      g+='<g class="mm-n" data-act="mmCol" data-n="'+n.id+'" role="button" tabindex="0" aria-label="'+(col?'Expandir':'Recolher')+' ramo"><circle cx="'+bx+'" cy="'+by+'" r="15" fill="transparent"/><circle cx="'+bx+'" cy="'+by+'" r="'+(col?10:7)+'" fill="var(--surface)" stroke="'+(root?'var(--accent)':slot(f.ci))+'" stroke-width="2.5"/>'+
        (col?'<text x="'+bx+'" y="'+(by+4)+'" text-anchor="middle" style="font:700 11px var(--body);fill:var(--ink)">'+f.kc+'</text>':'<path d="M'+(bx-3)+','+by+'H'+(bx+3)+'" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>')+'</g>';
    }
  });
  return '<svg width="'+Math.round(L.W*z)+'" height="'+Math.round(L.H*z)+'" viewBox="0 0 '+L.W+' '+L.H+'" role="group" aria-label="Mapa mental">'+e+g+'</svg>';
}
function mmAdd(pid){

function render(){
  const oldSc=$('#mm-sc');if(oldSc&&typeof oldSc.scrollLeft==='number'){mm.sx=oldSc.scrollLeft;mm.sy=oldSc.scrollTop}
  const xi=xpInfo(),running=T.state==='run'&&T.mode==='focus'||T.state==='run';
  const nav=(cls)=>NAV.map(n=>'<button class="'+cls+'" data-act="go" data-v="'+n[0]+'" '+(view===n[0]?'aria-current="page"':'')+'>'+ic(n[2])+'<span>'+n[1]+'</span></button>').join('');
  const pill=running&&view!=='foco'?'<button class="pill" data-act="go" data-v="foco" aria-label="Voltar ao timer"><span class="dot"></span><span id="pill-time" class="num">'+fmtClock(T.left)+'</span></button>':'';
  $('#app').innerHTML=
   '<div class="shell"><aside class="side"><div class="brand">'+dog('happy',true)+'<span>Bora<br>Estudar</span></div>'+nav('nav-b')+
   '<div class="side-xp"><div class="row" style="justify-content:space-between;margin-bottom:8px"><b>Nível '+xi.level+'</b><span class="muted" style="font-size:13px">'+xi.into+'/'+xi.need+' XP</span></div><div class="bar"><i style="width:'+(xi.into/xi.need*100)+'%"></i></div></div></aside>'+
   '<main><div class="main-in">'+(view!=='hoje'?'<div class="brand-m">'+dog('happy',true)+'<b>Bora Estudar</b></div>':'')+'<header class="top"><h1>'+TITLES[view]+'</h1><div class="top-r">'+pill+'<button class="icon-b" data-act="go" data-v="ajustes" aria-label="Ajustes" '+(view==='ajustes'?'aria-current="page"':'')+'>'+ic('gear')+'</button></div></header><div id="view"></div></div></main>'+
   '<nav class="tabs" aria-label="Navegação principal">'+nav('tab-b')+'</nav></div>';
  const v=$('#view');
  const fn={hoje:viewHoje,foco:viewFoco,materias:viewMaterias,mapas:viewMapas,progresso:viewProgresso,conquistas:viewConquistas,ajustes:viewAjustes}[view];
  v.innerHTML=fn();
  if(view==='mapas'&&mm.id){
    const sc=$('#mm-sc');
    if(sc){sc.scrollLeft=mm.sx||0;sc.scrollTop=mm.sy||0;if(mm.reveal){mmReveal();mm.reveal=false}}
    if(mm.focus){const i=$('#mm-text');if(i&&i.focus){i.focus();i.select()}mm.focus=false}
  }
  if(view==='progresso'){v.innerHTML=fn()} // segunda passada com a largura real do contêiner
}

/* ---------- eventos ---------- */
const acts={
  go:e=>navigate(e.dataset.v),
  mmOpen:e=>{mm.id=e.dataset.m;const m=mmCur(),r=m&&m.nodes.find(n=>!n.p);mm.sel=r?r.id:null;mm.zoom=1;mm.sx=0;mm.sy=0;armed=null;render()},
  mmBack:()=>{mm.id=null;armed=null;render()},
  mmSel:e=>{mm.sel=e.dataset.n;armed=null;render()},
  mmChild:()=>mmAdd(mm.sel),
  mmSib:()=>{const m=mmCur(),n=m&&m.nodes.find(x=>x.id===mm.sel);if(!n)return;mmAdd(n.p||n.id)},
  mmCol:e=>{
    const m=mmCur();if(!m)return;const id=(e&&e.dataset&&e.dataset.n)||mm.sel,n=m.nodes.find(x=>x.id===id);if(!n)return;
    n.col=!n.col;mm.sel=id;persist();render();
  },
  mmDel:()=>{
    if(armed!=='mmdel'){armed='mmdel';render();return}
    const m=mmCur(),n=m&&m.nodes.find(x=>x.id===mm.sel);armed=null;if(!n||!n.p){render();return}
    const ids=mmDesc(m,n.id);m.nodes=m.nodes.filter(x=>ids.indexOf(x.id)<0);mm.sel=n.p;persist();render();
  },
  mmZoom:e=>{mm.zoom=clamp(Math.round(((mm.zoom||1)+(+e.dataset.d)*.15)*100)/100,.4,2);render()},
  mmFit:()=>{const m=mmCur(),sc=$('#mm-sc'),L=m&&mmLayout(m);if(!L||!sc)return;mm.zoom=clamp(Math.round((sc.clientWidth-8)/L.W*100)/100,.4,1.3);mm.sx=0;mm.sy=0;render()},
  mapDel:e=>{
    if(armed!=='mapdel:'+e.dataset.m){armed='mapdel:'+e.dataset.m;render();return}
    S.maps=S.maps.filter(x=>x.id!==e.dataset.m);armed=null;persist();render();
  },
  start:()=>{if(T.state==='done'){T.state='idle';T.result=null}timerStart()},
  pause:()=>timerPause(),
  reset:()=>timerReset(),
  finish:()=>timerFinish(true),
  skipBreak:()=>{clearInterval(T.iv);T.state='idle';T.mode='focus';render()},
  breakStart:()=>{T.mode='break';T.state='idle';T.result=null;timerStart()},
  clean:()=>{document.body.classList.toggle('clean');render()},
  pickS:e=>{T.subj=e.dataset.s;render()},
  pickLen:e=>{T.len=+e.dataset.m;T.state='idle';render()},
  startMission:e=>{
    if(T.state==='run'||T.state==='pause'){navigate('foco');return}
    T.subj=e.dataset.s;T.mode='focus';T.state='idle';view='foco';try{location.hash='foco'}catch(x){}window.scrollTo(0,0);timerStart();
  },
  toggleS:e=>{openSubj=openSubj===e.dataset.s?null:e.dataset.s;armed=null;render()},
  cycle:e=>{
    const s=subj(e.dataset.s),t=s&&s.topics.find(x=>x.id===e.dataset.t);if(!t)return;
    t.st=(t.st+1)%4;t.d=todayStr();persist();render();
    if(t.st===3)toast('Tópico dominado! +20 XP');
  },
  delTopic:e=>{const s=subj(e.dataset.s);if(!s)return;s.topics=s.topics.filter(x=>x.id!==e.dataset.t);persist();render()},
  delSubj:e=>{
    if(armed!=='del:'+e.dataset.s){armed='del:'+e.dataset.s;render();return}
    S.subjects=S.subjects.filter(s=>s.id!==e.dataset.s);openSubj=null;armed=null;if(T.subj===e.dataset.s)T.subj=null;persist();render();
  },
  unpark:e=>{S.parked.splice(+e.dataset.i,1);persist();render()},
  clearSample:()=>{
    if(armed!=='clear'){armed='clear';render();return}
    S.isSample=false;S.sessions=[];S.questions=[];S.parked=[];S.maps=[];mm.id=null;
    S.subjects.forEach(s=>s.topics.forEach(t=>{t.st=0;t.d=''}));
    S.profile.name='Meu concurso';armed=null;persist();render();toast('Tudo limpo. Vamos começar!');
  }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(armed){armed=null;render()}return}
  const k=el.dataset.act;
  if(armed&&!((k==='delSubj'&&armed==='del:'+el.dataset.s)||(k==='clearSample'&&armed==='clear')||(k==='mmDel'&&armed==='mmdel')||(k==='mapDel'&&armed==='mapdel:'+el.dataset.m)))armed=null;
  if(acts[k])acts[k](el);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const k=f.dataset.form,fd=new FormData(f);
  if(k==='logq'){
    const n=parseInt(fd.get('n'),10),r=parseInt(fd.get('r'),10),sid=fd.get('s');
    if(!sid){toast('Escolha uma matéria');return}
    if(!(n>0)||!(r>=0)||r>n){toast('Os acertos não podem passar do total de questões');return}
    S.questions.push({d:todayStr(),s:sid,n:n,r:r});persist();render();toast('Salvo! +'+r+' XP pelos acertos');
  } else if(k==='park'){
    const p=String(fd.get('p')||'').trim();if(!p)return;(S.parked=S.parked||[]).push(p);persist();render();
    const i=$('#park-in');if(i)i.focus();
  } else if(k==='addTopic'){
    const n=String(fd.get('n')||'').trim(),s=subj(f.dataset.s);if(!n||!s)return;
    s.topics.push({id:newId(),n:n,st:0,d:''});persist();render();
  } else if(k==='newMap'){
    const s=subj(fd.get('s')),name=String(fd.get('n')||'').trim();let m;
    if(s){m=mapFromSubject(s);if(name)m.nodes[0].t=name}
    else{if(!name){toast('Dê um nome ao tema');return}m={id:newId(),s:'',nodes:[{id:newId(),p:null,t:name,col:false}]}}
    (S.maps=S.maps||[]).push(m);mm.id=m.id;mm.sel=m.nodes[0].id;mm.zoom=1;mm.sx=0;mm.sy=0;persist();render();toast('Mapa criado! Toque em Filho para ramificar.');
  } else if(k==='addSubj'){
    const n=String(fd.get('n')||'').trim();if(!n)return;
    const used=new Set(S.subjects.map(s=>s.c));let c=0;while(used.has(c)&&c<8)c++;if(c>=8)c=S.subjects.length%8;
    const id=newId();S.subjects.push({id:id,name:n,c:c,topics:[]});openSubj=id;persist();render();
  }
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-set]');if(!el)return;
  const k=el.dataset.set;let v=el.value;
  if(['goal','acc','block'].indexOf(k)>=0){v=parseInt(v,10);if(!(v>0))return;if(k==='goal')v=clamp(v,10,600);if(k==='acc')v=clamp(v,30,100)}
  S.profile[k]=v;if(k==='block'){T.len=null;if(T.state==='idle'){T.total=v*60;T.left=T.total}}
  persist();toast('Ajuste salvo');
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.body.classList.contains('clean')){document.body.classList.remove('clean');render();return}
  const t=e.target;if(!t)return;
  if(t.id==='mm-text'){
    if(e.key==='Enter'){e.preventDefault();acts.mmSib()}
    else if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();acts.mmChild()}
    else if(e.key==='Escape'){t.blur()}
  } else if((e.key==='Enter'||e.key===' ')&&t.matches&&t.matches('g[data-act]')){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
document.addEventListener('input',e=>{
  const t=e.target;if(!t||t.id!=='mm-text')return;
  const m=mmCur(),n=m&&m.nodes.find(x=>x.id===mm.sel);if(!n)return;
  n.t=t.value;const c=$('#mm-canvas');if(c)c.innerHTML=mmSvg(m);persist();
});

/* tooltip dos gráficos */
const tip=$('#tip');
function showTip(el,x,y){
  const t=el.getAttribute('data-tip');if(!t){tip.hidden=true;return}
  tip.textContent=t;tip.hidden=false;
  const w=tip.offsetWidth,h=tip.offsetHeight;
  tip.style.left=clamp(x+12,8,window.innerWidth-w-8)+'px';tip.style.top=clamp(y-h-12,8,window.innerHeight-h-8)+'px';
}
document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY)});
document.addEventListener('pointermove',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else tip.hidden=true});
document.addEventListener('click',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else tip.hidden=true});
document.addEventListener('pointerout',e=>{if(e.pointerType==='mouse'&&e.target.closest('[data-tip]'))tip.hidden=true});

let rz=0;
window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(view==='progresso')render()},200)});

T.total=tlen()*60;T.left=T.total;T.subj=S.subjects[0]?S.subjects[0].id:null;
render();
initCloud();
})();
</script>
</body>
